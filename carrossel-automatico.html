<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel Automático</title>
  <style>
    body { font-family: Arial, sans-serif; background: #101820; color: #fff; margin: 0; padding: 24px; }
    .carrossel { max-width: 700px; margin: 0 auto; overflow: hidden; border-radius: 12px; }
    .slides { display: flex; animation: troca 12s infinite; }
    .slide { min-width: 100%; }
    .slide img { width: 100%; height: 390px; object-fit: cover; display: block; }

    @keyframes troca {
      0%, 25%   { transform: translateX(0); }
      33%, 58%  { transform: translateX(-100%); }
      66%, 91%  { transform: translateX(-200%); }
      100%      { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="carrossel" aria-label="Carrossel de imagens automático">
    <div class="slides">
      <div class="slide"><img src="https://picsum.photos/id/1040/800/450" alt="Imagem 1"></div>
      <div class="slide"><img src="https://picsum.photos/id/1050/800/450" alt="Imagem 2"></div>
      <div class="slide"><img src="https://picsum.photos/id/1060/800/450" alt="Imagem 3"></div>
    </div>
  </div>
</body>
</html>
