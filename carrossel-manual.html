<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel Manual</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 24px; }
    .carrossel { max-width: 640px; margin: 0 auto; position: relative; overflow: hidden; border-radius: 12px; }
    .slides { display: flex; transition: transform .3s ease; }
    .slide { min-width: 100%; }
    .slide img { display: block; width: 100%; height: 360px; object-fit: cover; }
    button {
      position: absolute; top: 50%; transform: translateY(-50%);
      border: 0; background: rgba(0, 0, 0, .55); color: #fff;
      width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    }
    .prev { left: 12px; }
    .next { right: 12px; }
  </style>
</head>
<body>
  <div class="carrossel">
    <div class="slides" id="slides">
      <div class="slide"><img src="https://picsum.photos/id/1015/800/450" alt="Slide 1"></div>
      <div class="slide"><img src="https://picsum.photos/id/1025/800/450" alt="Slide 2"></div>
      <div class="slide"><img src="https://picsum.photos/id/1035/800/450" alt="Slide 3"></div>
    </div>
    <button class="prev" id="prev" aria-label="Anterior">&#10094;</button>
    <button class="next" id="next" aria-label="Próximo">&#10095;</button>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const total = slides.children.length;
    let index = 0;

    function render() {
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    document.getElementById('prev').addEventListener('click', () => {
      index = (index - 1 + total) % total;
      render();
    });

    document.getElementById('next').addEventListener('click', () => {
      index = (index + 1) % total;
      render();
    });
  </script>
</body>
</html>
